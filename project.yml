name: AppDowngrader

# The single source of truth for the .xcodeproj (the generated one is gitignored).
# The repo used to commit a hand-maintained AppDowngrader.xcodeproj and it rotted: a later
# Logger.swift was never synced into it, so xcodebuild archive failed with
# "cannot find 'Logger' in scope", and MARKETING_VERSION was still 0.0.1.
# project.yml is text, reviewable, and needs no syncing when files are added - hence xcodegen.
#
# Why an .xcodeproj at all, rather than just Package.swift: SwiftPM is a build system for
# libraries and CLIs, and it does not produce a .app - no bundle layout, no Info.plist
# placement, no signing, no notarization. And putting Go-built third-party executables inside
# SPM resources (.copy("bin")) drags in two extra problems: a strip crash during release
# builds, and resources having to be looked up through Package_Target.bundle.
# Package.swift stays for day-to-day `swift run` (ipatool / ios are on PATH locally).

options:
  bundleIdPrefix: com.rxliuli
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # The **single source of truth** for the version is right here: the Info.plist at the repo
    # root holds $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION), substituted by Xcode at build
    # time. The release CI reads this file with rxliuli/version-check to decide whether to
    # publish, so a version bump is a one-line change here and nowhere else.
    MARKETING_VERSION: "0.0.6"
    # The build number is derived from the version as x*10000 + y*100 + z (0.0.6 -> 6).
    # dmg.sh computes the same value in CI and overrides this; the value here only serves local
    # archives.
    CURRENT_PROJECT_VERSION: "6"
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: N2X78TUUFG

targets:
  AppDowngrader:
    type: application
    platform: macOS
    sources:
      # Exclude the two non-source items: they are handled by the folder reference / the single
      # resource file below
      - path: Sources
        excludes:
          - bin
          - AppIcon.png
      # The bundled third-party executables (Go-built ipatool / go-ios), invoked by the app at
      # runtime. This has to be a folder reference (type: folder) - with a group, Xcode flattens
      # the files into the root of Contents/Resources, while the app looks them up under
      # .../Resources/bin/<cmd>.
      - path: Sources/bin
        type: folder
        buildPhase: resources
      # CFBundleIconFile=AppIcon, and the app also uses it to set the Dock icon at launch
      - path: Sources/AppIcon.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: AppDowngrader
        # Deliberately a build setting rather than XcodeGen's `entitlements:` block: that block
        # regenerates the file from `properties`, and with no properties given it rewrote
        # AppDowngrader.entitlements into an empty <dict/>, silently dropping allow-jit /
        # disable-library-validation - whose runtime symptom is SAP login failing because dlopen
        # of Unicorn is blocked by the hardened runtime. The entitlements file stays a normal file
        # in the repo and Xcode uses it as-is.
        CODE_SIGN_ENTITLEMENTS: AppDowngrader.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.rxliuli.AppDowngrader
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        # The script phase below writes files into the .app and signs them; script sandboxing
        # would block that
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Sign bundled binaries
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail

          # Xcode signs the .app as a whole, but it does not know about the two third-party
          # executables in bin/: they are not build products and they are not in Frameworks.
          # Notarization requires **every** Mach-O to carry a valid signature, so they have to be
          # signed by hand here, inside-out - inner layers first, so that the outer .app's seal
          # covers their hashes too.

          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY:-}}"
          if [ -z "${IDENTITY}" ]; then
            echo "error: no signing identity available (both EXPANDED_CODE_SIGN_IDENTITY and CODE_SIGN_IDENTITY are empty)"
            exit 1
          fi

          APP="${CODESIGNING_FOLDER_PATH:-${TARGET_BUILD_DIR}/${WRAPPER_NAME}}"
          BIN_DIR="${APP}/Contents/Resources/bin"
          if [ ! -d "${BIN_DIR}" ]; then
            echo "error: ${BIN_DIR} not found - was Sources/bin not copied into Contents/Resources as a folder reference?"
            exit 1
          fi

          # Same entitlements as the .app: ipatool has to dlopen the Unicorn runtime (JIT), and
          # without disable-library-validation / allow-jit the hardened runtime blocks it at
          # runtime.
          for bin in "${BIN_DIR}"/*; do
            echo "==> signing $(basename "${bin}")"
            codesign --force --options runtime --timestamp \
              --entitlements "${SRCROOT}/AppDowngrader.entitlements" \
              --sign "${IDENTITY}" "${bin}"
          done

          for bin in "${BIN_DIR}"/*; do
            codesign --verify --strict --verbose=2 "${bin}"
          done
