name: Release

on:
  push:
    branches: [main]
    paths:
      - 'Info.plist'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: version
        run: |
          read_version() {
            python3 -c "import plistlib,sys;print(plistlib.load(open(sys.argv[1],'rb'))['CFBundleShortVersionString'])" "$1"
          }
          CURRENT=$(read_version Info.plist)
          PREVIOUS=""
          if git show HEAD~1:Info.plist > /tmp/prev.plist 2>/dev/null; then
            PREVIOUS=$(read_version /tmp/prev.plist || true)
          fi
          echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"
          if [[ "${CURRENT}" != "${PREVIOUS}" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-macos-dmg:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: macos-latest
    environment: release-macOS

    steps:
      - uses: actions/checkout@v6

      # .xcodeproj 是 xcodegen 的产物（已在 .gitignore 里），CI 上必须现生成。
      # 之前这里提交过一份手工维护的 pbxproj，它腐烂了 —— 后加的 Logger.swift
      # 没人同步进去，archive 直接报 cannot find 'Logger' in scope。
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # archive → Developer ID 签名（含内容里的 ipatool / go-ios）→ DMG →
      # 公证 → 盖章 → Gatekeeper 校验。规则与「为什么」都在共享 action 那边：
      # https://github.com/rxliuli/apple-release
      # 内置的两个第三方可执行文件由 project.yml 的 "Sign bundled binaries"
      # 脚本阶段负责签名（应用运行时要调用它们，公证要求每个 Mach-O 都带有效签名）。
      - uses: rxliuli/apple-release/dmg@v1
        id: dmg
        with:
          project: AppDowngrader.xcodeproj
          scheme: AppDowngrader
          version: ${{ needs.check-version.outputs.version }}
          certificate-base64: ${{ secrets.APPLE_CERTIFICATE_DEVELOPERID_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_DEVELOPERID_PASSWORD }}
          api-key: ${{ secrets.APPLE_API_KEY }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ${{ steps.dmg.outputs.dmg-path }}

  release:
    needs: [check-version, build-macos-dmg]
    runs-on: ubuntu-latest
    # TAP_GITHUB_TOKEN 是可选的：没配就跳过 cask bump。secrets 不能出现在 if 条件里
    # （steps.if 拿不到 secrets context），所以先落到 job 级 env，再用 env.TAP_TOKEN 判断。
    env:
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ needs.check-version.outputs.version }}"
          git tag "${VERSION}"
          git push origin "${VERSION}"
          gh release create "${VERSION}" \
            --title "Release ${VERSION}" \
            --generate-notes \
            artifacts/*

      # 只改 tap 里 cask 的 version / sha256 两行，livecheck / caveats / zap 原样保留；
      # 改不动会直接失败，不像手写 sed 那样静默通过。
      - name: Update Homebrew tap
        if: env.TAP_TOKEN != ''
        uses: rxliuli/apple-release/tap-update@v1
        with:
          cask: app-downgrader
          version: ${{ needs.check-version.outputs.version }}
          artifact: artifacts/AppDowngrader-macos.dmg
          token: ${{ env.TAP_TOKEN }}
